name: KitsPersonalizados
version: '1.0.0'
main: com.darkmortol.kitspersonalizados.KitsPersonalizados
api-version: '1.21'
author: DARKMORTOL
description: Sistema de kits completamente personalizables mediante GUIs.
softdepend: [Vault]

commands:
  kitsp:
    description: Comando general del plugin — todas las funciones tienen su propia pantalla visual.
    usage: |
      /kitsp (abre el menú) | /kitsp crear [nombre] | /kitsp editar [nombre] |
      /kitsp borrar [nombre] | /kitsp listar | /kitsp dar [nombre] [jugador] |
      /kitsp lista | /kitsp staff | /kitsp <nombre> [jugador]
    aliases: [kits]

permissions:
  kitspersonalizados.admin:
    description: Permite crear, editar, borrar y listar (vista admin) los kits.
    default: op
  kitspersonalizados.admin.dar:
    description: Permite entregar kits a otros jugadores sin cooldown.
    default: op
