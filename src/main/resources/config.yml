# Configuración de KitsPersonalizados
# Intervalo (en ticks) con el que se revisan los efectos personalizados. 20 ticks = 1 segundo.
intervalo-revision-efectos: 20
# Duración (en ticks) que se aplica cada vez que se refresca un efecto personalizado.
duracion-efecto-aplicado: 60

mensajes:
  sin-permiso: "&cNo tienes permiso para hacer esto."
  kit-no-existe: "&cEl kit '%kit%' no existe."
  kit-ya-existe: "&cYa existe un kit con ese nombre."
  nombre-invalido: "&cEl nombre solo puede tener letras, números, '_' y '-' (máx. 32 caracteres)."
  nombre-reservado: "&cEl nombre '%nombre%' está reservado para un subcomando de /kitsp. Elegí otro."
  kit-borrado: "&aEl kit '%kit%' fue eliminado."
  kit-entregado-admin: "&aLe entregaste el kit '%kit%' a %jugador%."
  kit-recibido-admin: "&aRecibiste el kit '%kit%' de un administrador."
  kit-reclamado: "&aReclamaste el kit '%kit%'."
  kit-reclamado-staff: "&aReclamaste el kit de staff '%kit%'."
  kit-sin-permiso-staff: "&cNo tienes el permiso de staff para el kit '%kit%'."
  kit-en-cooldown: "&cDebes esperar &e%tiempo% &cpara volver a reclamar este kit."
  kit-sin-permiso-reclamar: "&cNo tienes permiso para reclamar el kit '%kit%'."
  jugador-no-encontrado: "&cEl jugador '%jugador%' no está conectado."
  kit-comprado: "&aCompraste el kit '%kit%' por &6%precio%&a."
  fondos-insuficientes: "&cNo tienes suficiente dinero. Te faltan &6%faltante%&c."
  economia-no-disponible: "&cLa economía del servidor no está disponible (¿Vault y un plugin de economía instalados?)."
