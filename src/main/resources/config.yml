# Configuración de KitsPersonalizados
# Intervalo (en ticks) con el que se revisan los efectos personalizados. 20 ticks = 1 segundo.
intervalo-revision-efectos: 20
# Duración (en ticks) que se aplica cada vez que se refresca un efecto personalizado.
duracion-efecto-aplicado: 60

