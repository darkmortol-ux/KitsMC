name: Build y Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar con Maven
        run: mvn -B clean package

      - name: Borrar tag/release 'latest' anteriores (si existen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      - name: Crear release 'latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última compilación
          prerelease: true
          make_latest: true
          files: target/KitsPersonalizados.jar
